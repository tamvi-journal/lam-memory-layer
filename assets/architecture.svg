<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Agent Memory Core architecture</title>
  <desc id="desc">Evidence enters validated intake, produces immutable revisions, activates through cues, and becomes a bounded context packet while profiles and access telemetry remain separate.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111326"/>
      <stop offset=".55" stop-color="#0a0d18"/>
      <stop offset="1" stop-color="#171025"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#aa82ff"/><stop offset="1" stop-color="#6655ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72ecff"/><stop offset="1" stop-color="#3199d6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffc77a"/><stop offset="1" stop-color="#ef7c58"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 9 3 0 6Z" fill="#7f799b"/>
    </marker>
    <style>
      .eyebrow{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;fill:#9f9ab6}
      .label{font:700 21px Inter,ui-sans-serif,system-ui,sans-serif;fill:#f7f4ff}
      .copy{font:400 14px Inter,ui-sans-serif,system-ui,sans-serif;fill:#b5b0c5}
      .small{font:500 12px Inter,ui-sans-serif,system-ui,sans-serif;fill:#aaa5bb}
      .flow{fill:none;stroke:#7f799b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1280" height="620" rx="30" fill="url(#canvas)"/>
  <circle cx="180" cy="80" r="170" fill="#436cff" opacity=".07"/>
  <circle cx="1110" cy="570" r="220" fill="#bf5aff" opacity=".07"/>

  <text x="64" y="58" class="eyebrow">SEMANTIC MEMORY PIPELINE</text>
  <text x="64" y="92" class="label" font-size="27">Meaning may evolve. History remains inspectable.</text>

  <g filter="url(#shadow)">
    <rect x="64" y="174" width="200" height="160" rx="22" fill="#171a2b" stroke="#4c5170"/>
    <circle cx="100" cy="213" r="16" fill="url(#amber)"/>
    <text x="128" y="220" class="label">Evidence</text>
    <text x="88" y="260" class="copy">Source references</text>
    <text x="88" y="284" class="copy">Confidence</text>
    <text x="88" y="308" class="copy">Truth basis</text>
  </g>

  <path d="M264 254H320" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="322" y="174" width="220" height="160" rx="22" fill="#171a2b" stroke="#6d5ed2"/>
    <circle cx="360" cy="213" r="16" fill="url(#violet)"/>
    <text x="388" y="220" class="label">Validated intake</text>
    <text x="346" y="260" class="copy">Logic + provenance</text>
    <text x="346" y="284" class="copy">Conflict handling</text>
    <text x="346" y="308" class="copy">Protected boundaries</text>
  </g>

  <path d="M542 254H598" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="600" y="150" width="262" height="208" rx="26" fill="#171a2b" stroke="#4d8faf"/>
    <text x="628" y="194" class="eyebrow">APPEND-ONLY</text>
    <text x="628" y="229" class="label">Immutable revisions</text>
    <g transform="translate(626 253)">
      <rect x="0" y="0" width="186" height="48" rx="13" fill="#22273a" stroke="#4b536f"/>
      <rect x="10" y="-10" width="186" height="48" rx="13" fill="#23243c" stroke="#675b94"/>
      <rect x="20" y="-20" width="186" height="48" rx="13" fill="#1f3040" stroke="#4ca5c7"/>
      <circle cx="42" cy="4" r="7" fill="#78e9ff" filter="url(#glow)"/>
      <text x="59" y="10" class="small">current semantic claim</text>
    </g>
    <text x="628" y="337" class="small">Prior states stay addressable.</text>
  </g>

  <path d="M862 254H918" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="920" y="174" width="296" height="160" rx="22" fill="#171a2b" stroke="#646083"/>
    <circle cx="958" cy="213" r="16" fill="url(#cyan)"/>
    <text x="986" y="220" class="label">Cue retrieval</text>
    <text x="944" y="260" class="copy">Explicit cues + lexical overlap</text>
    <text x="944" y="284" class="copy">Graph activation + scope</text>
    <text x="944" y="308" class="copy">Bounded context packet</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="138" y="422" width="424" height="126" rx="22" fill="#151827" stroke="#4c5170"/>
    <text x="166" y="461" class="eyebrow">HOST-OWNED</text>
    <text x="166" y="495" class="label">Profiles define identity, axes &amp; authority</text>
    <text x="166" y="523" class="copy">The generic kernel never owns the agent.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="616" y="422" width="526" height="126" rx="22" fill="#151827" stroke="#4c5170"/>
    <text x="644" y="461" class="eyebrow">DYNAMIC, NON-SEMANTIC</text>
    <text x="644" y="495" class="label">Access telemetry changes without rewriting meaning</text>
    <text x="644" y="523" class="copy">Recency and accessibility may move; authority and content do not.</text>
  </g>

  <path d="M350 422V372H432V334" fill="none" stroke="#5f5b78" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M879 422V380H731V358" fill="none" stroke="#5f5b78" stroke-width="2" stroke-dasharray="6 7"/>
</svg>
