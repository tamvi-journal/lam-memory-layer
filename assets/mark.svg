<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Agent Memory Core mark</title>
  <desc id="desc">A crystalline memory core surrounded by preserved revision rings.</desc>
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%">
      <stop offset="0" stop-color="#282251"/>
      <stop offset="0.62" stop-color="#121426"/>
      <stop offset="1" stop-color="#090b12"/>
    </radialGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#69e7ff"/>
      <stop offset="0.48" stop-color="#9a78ff"/>
      <stop offset="1" stop-color="#ffad65"/>
