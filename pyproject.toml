[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lam-memory-layer"
version = "0.4.0"
description = "External cue-driven continuity memory for AI work agent"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.28,<2",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
lml = "lml.cli:main"
lml-mcp = "lml.mcp_server:main"

[tool.setuptools.packages.find]
include = ["lml*"]

[tool.setuptools.package-data]
lml = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
