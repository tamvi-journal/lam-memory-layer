[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-core"
version = "0.1.0"
description = "Profile-driven cue memory with immutable revisions and validated intake"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["memory_core*"]

[tool.setuptools.package-data]
memory_core = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
