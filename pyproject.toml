[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-core"
version = "0.1.0"
description = "Profile-driven cue memory with immutable revisions and validated intake"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["agents", "memory", "provenance", "retrieval", "revisions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/tamvi-journal/agent-memory-core"
Documentation = "https://github.com/tamvi-journal/agent-memory-core/tree/main/docs"

[tool.setuptools.packages.find]
include = ["memory_core*"]

[tool.setuptools.package-data]
memory_core = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
